<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- ─── Content Security Policy ─────────────────────────────────────────────
         حماية التوكن المخزّن في localStorage من أي ثغرة XSS: المنع الكامل لأي
         سكريبت inline أو من مصدر خارجي. السكريبتات المسموحة = ملفات نفس الدومين فقط.
         style-src بيسمح بـ 'unsafe-inline' لأن مكتبة shadcn/tailwind بتستخدم
         أنماط runtime، وده خطره أقل بكثير من سكريبت inline. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'" />

    <!-- Viewport + PWA display -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STARK" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />

    <!-- Android + Chrome PWA theme -->
    <meta name="theme-color" content="#c9971c" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- SEO -->
    <meta name="description" content="STARK لوجستيك — خدمات شحن سريعة وموثوقة تغطي كل محافظات مصر" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="shortcut icon" href="/icon-192.png" />

    <title>STARK — شركة الشحن الموثوقة في مصر</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Video responsive fix for all screens -->
    <style>
      #login-bg-video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        object-fit: cover !important;
        object-position: center center !important;
        z-index: 0 !important;
        pointer-events: none !important;
        max-width: none !important;
        max-height: none !important;
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }
      @supports (-webkit-touch-callout: none) {
        /* iOS Safari fix */
        #login-bg-video {
          height: -webkit-fill-available !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
